<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08122b">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500&family=DM+Mono&display=swap">
<style>
/* Azul marino oscuro con amarillo pato. Una columna: lista con scroll y reproductor abajo. */
:root {
  --bg: #08122b;
  --surface: #0f1d42;
  --surface-2: #182b5e;
  --fg: #eef1fb;
  --muted: #8d9ac2;
  --accent: #ffd426;
  --accent-fg: #08122b;
  --line: #243564;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; fill: currentColor; display: block; }

.app {
  height: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding-inline: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Encabezado */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; line-height: 1; min-width: 0; }
.brand span { color: var(--accent); }
.add {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent); color: var(--accent-fg);
  border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 500; flex-shrink: 0;
}
.add svg.i { width: 20px; height: 20px; }

/* Lista */
.list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-block: 2px; }
.list.dragging { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 16px; }
.count { color: var(--muted); font-size: 13px; padding-bottom: 4px; }
.count b { font-family: var(--font-mono); font-weight: 400; color: var(--fg); }
.row { display: flex; align-items: center; gap: 2px; }
.track {
  display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;
  background: transparent; border: 0; border-radius: 12px; padding: 8px; text-align: left;
}
.track:hover { background: var(--surface); }
.track.active { background: var(--surface-2); }
.track .meta { flex: 1; min-width: 0; }
.track .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track.active .name { color: var(--accent); }
.track .dur { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.rbtn { background: none; border: 0; padding: 9px; border-radius: 10px; color: var(--muted); flex-shrink: 0; }
.rbtn:hover { color: var(--accent); background: var(--surface); }
.rbtn svg.i { width: 20px; height: 20px; }

.cover {
  width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #fff;
  text-transform: uppercase; background-size: cover; background-position: center;
}

/* Estado vacío */
.empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 24px 8px; color: var(--muted);
  border: 2px dashed var(--line); border-radius: 20px;
}
.empty h2 { margin: 0; color: var(--fg); font-family: var(--font-display); font-size: 22px; font-weight: 600; text-wrap: balance; }
.empty p { margin: 0; max-width: 32ch; text-wrap: balance; }
.empty svg.i { width: 44px; height: 44px; color: var(--accent); }

/* Reproductor */
.player {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 14px 14px 12px; margin-bottom: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.now { display: flex; align-items: center; gap: 12px; }
.now .cover {
  width: 64px; height: 64px; font-size: 28px; border-radius: 14px;
  background-color: var(--surface-2); color: var(--muted); border: 0; padding: 0;
}
.now .cover:disabled { cursor: default; }
.now .meta { min-width: 0; flex: 1; }
.now .title { font-family: var(--font-display); font-weight: 600; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.now .sub { color: var(--muted); font-size: 13px; }

.seek { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.seek time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seek time:last-child { text-align: right; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer;
  --p: 0%;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px;
  background: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p));
}
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); border: 0; margin-top: -5px;
}
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 0; }
input[type=range]:disabled { cursor: default; opacity: 0.5; }

.controls { display: flex; align-items: center; justify-content: center; gap: 6px; }
.ctl { background: none; border: 0; border-radius: 50%; width: 52px; height: 52px; display: grid; place-items: center; }
.ctl:hover:not(:disabled) { background: var(--surface-2); }
.ctl:disabled { opacity: 0.35; cursor: default; }
.ctl svg.i { width: 30px; height: 30px; }
.ctl.big { width: 68px; height: 68px; background: var(--accent); color: var(--accent-fg); }
.ctl.big:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.ctl.big svg.i { width: 36px; height: 36px; }
.hint { text-align: center; color: var(--muted); font-size: 12px; min-height: 1em; }

@media (max-width: 380px) {
  .ctl { width: 46px; height: 46px; }
  .ctl.big { width: 62px; height: 62px; }
  .controls { gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>

</svg>

<div class="app" id="app">
  <header class="top">
    <div class="brand">Musiquita <span>Dumps</span></div>
    <button class="add" id="addBtn" type="button"><svg class="i"><use href="#i-plus"/></svg>Subir MP3</button>
  </header>

  <main class="list" id="list" aria-label="Tus canciones"></main>

  <section class="player" aria-label="Reproductor">
    <div class="now">
      <button class="cover" id="nowCover" type="button" aria-label="Cambiar portada" disabled><svg class="i"><use href="#i-note"/></svg></button>
      <div class="meta">
        <div class="title" id="nowTitle">Nada sonando</div>
        <div class="sub" id="nowSub">Sube un MP3 para empezar</div>
      </div>
    </div>
    <div class="seek">
      <time id="tCur">0:00</time>
      <input type="range" id="seek" min="0" max="1000" step="1" value="0" disabled aria-label="Posición de la canción">
      <time id="tDur">0:00</time>
    </div>
    <div class="controls">
      <button class="ctl" id="bPrev" type="button" aria-label="Canción anterior" disabled><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="ctl" id="bBack" type="button" aria-label="Retroceder 10 segundos" disabled><svg class="i"><use href="#i-back10"/></svg></button>
      <button class="ctl big" id="bPlay" type="button" aria-label="Reproducir" disabled><svg class="i" id="playIcon"><use href="#i-play"/></svg></button>
      <button class="ctl" id="bFwd" type="button" aria-label="Adelantar 10 segundos" disabled><svg class="i"><use href="#i-fwd10"/></svg></button>
      <button class="ctl" id="bNext" type="button" aria-label="Siguiente canción" disabled><svg class="i"><use href="#i-next"/></svg></button>
    </div>
    <div class="hint" id="hint"></div>
  </section>
</div>

<input type="file" id="file" accept="audio/mpeg,audio/*,.mp3" multiple hidden>
<input type="file" id="coverFile" accept="image/*" hidden>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var audio = new Audio();
  audio.preload = 'metadata';
  audio.setAttribute('playsinline', '');

  var tracks = [];        // { id, name, blob, added, cover, url, duration, art }
  var current = -1;
  var seeking = false;
  var db = null;
  var coverTarget = null;
  var wantPlaying = false; // lo que la persona pidió: sonando o en pausa
  var recovering = false;
  var errRetry = false;
  var watchdog = null;

  /* ---------- Guardado local (IndexedDB) ---------- */
  function openDB() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open('musiquita-dumps', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('songs', { keyPath: 'id' }); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function dbAll() {
    return new Promise(function (res) {
      if (!db) return res([]);
      try {
        var q = db.transaction('songs').objectStore('songs').getAll();
        q.onsuccess = function () { res(q.result || []); };
        q.onerror = function () { res([]); };
      } catch (e) { res([]); }
    });
  }
  function dbSave(t) {
    if (!db) return;
    try {
      db.transaction('songs', 'readwrite').objectStore('songs')
        .put({ id: t.id, name: t.name, blob: t.blob, added: t.added, cover: t.cover || '' });
    } catch (e) {}
  }
  function dbDel(id) { if (!db) return; try { db.transaction('songs', 'readwrite').objectStore('songs').delete(id); } catch (e) {} }

  /* ---------- Utilidades ---------- */
  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function cleanName(n) { return n.replace(/\.(mp3|m4a|wav|ogg|aac|flac)$/i, '').replace(/[_]+/g, ' ').trim() || 'Sin título'; }
  function byId(id) { for (var i = 0; i < tracks.length; i++) if (tracks[i].id === id) return tracks[i]; return null; }
  function setIcon(id) { $('playIcon').firstElementChild.setAttribute('href', id); }

  /* Portadas: la imagen elegida, o un degradado azul/amarillo con la inicial */
  var PRESETS = [
    { a: '#ffd426', b: '#f2a900', fg: '#08122b' },
    { a: '#2c4a9a', b: '#12275f', fg: '#ffd426' },
    { a: '#ffe570', b: '#ffd426', fg: '#0d1b45' },
    { a: '#1b3272', b: '#0b1740', fg: '#ffe14d' }
  ];
  function preset(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
    return PRESETS[h % PRESETS.length];
  }
  function paintCover(el, t) {
    el.style.background = ''; el.style.backgroundImage = ''; el.textContent = '';
    if (t.cover) {
      el.style.backgroundImage = 'url("' + t.cover + '")';
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
      el.style.color = '';
    } else {
      var p = preset(t.name);
      el.style.background = 'linear-gradient(135deg,' + p.a + ',' + p.b + ')';
      el.style.color = p.fg;
      el.textContent = t.name.charAt(0) || 'M';
    }
  }
  function makeArt(name) {
    var c = document.createElement('canvas');
    c.width = c.height = 512;
    var g = c.getContext('2d');
    var p = preset(name);
    var gr = g.createLinearGradient(0, 0, 512, 512);
    gr.addColorStop(0, p.a); gr.addColorStop(1, p.b);
    g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
    g.fillStyle = p.fg;
    g.font = '800 280px "Bricolage Grotesque", system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText((name.charAt(0) || 'M').toUpperCase(), 256, 280);
    return c.toDataURL('image/jpeg', 0.85);
  }

  /* ---------- Lista ---------- */
  function renderList() {
    var list = $('list');
    list.textContent = '';
    if (!tracks.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<svg class="i"><use href="#i-note"/></svg><h2>Aún no hay canciones</h2><p>Sube tus MP3 o arrástralos aquí. Se quedan guardados en este dispositivo.</p>';
      var b = document.createElement('button');
      b.className = 'add'; b.type = 'button';
      b.innerHTML = '<svg class="i"><use href="#i-plus"/></svg>Subir MP3';
      b.addEventListener('click', function () { $('file').click(); });
      e.appendChild(b);
      list.appendChild(e);
      return;
    }
    var c = document.createElement('div');
    c.className = 'count';
    c.innerHTML = '<b>' + tracks.length + '</b> ' + (tracks.length === 1 ? 'canción' : 'canciones');
    list.appendChild(c);
    tracks.forEach(function (t, i) {
      var row = document.createElement('div');
      row.className = 'row';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'track' + (i === current ? ' active' : '');
      var cv = document.createElement('div');
      cv.className = 'cover';
      paintCover(cv, t);
      var meta = document.createElement('div');
      meta.className = 'meta';
      var nm = document.createElement('div');
      nm.className = 'name'; nm.textContent = t.name;
      var du = document.createElement('div');
      du.className = 'dur'; du.textContent = t.duration ? fmt(t.duration) : '--:--';
      meta.appendChild(nm); meta.appendChild(du);
      btn.appendChild(cv); btn.appendChild(meta);
      btn.addEventListener('click', function () { select(tracks.indexOf(t), true); });

      var pic = document.createElement('button');
      pic.type = 'button'; pic.className = 'rbtn';
      pic.setAttribute('aria-label', 'Poner portada a ' + t.name);
      pic.innerHTML = '<svg class="i"><use href="#i-image"/></svg>';
      pic.addEventListener('click', function () { pickCover(t.id); });

      var del = document.createElement('button');
      del.type = 'button'; del.className = 'rbtn';
      del.setAttribute('aria-label', 'Quitar ' + t.name);
      del.innerHTML = '<svg class="i"><use href="#i-trash"/></svg>';
      del.addEventListener('click', function () { removeTrack(tracks.indexOf(t)); });

      row.appendChild(btn); row.appendChild(pic); row.appendChild(del);
      list.appendChild(row);
    });
  }

  function updateControls() {
    var has = tracks.length > 0 && current >= 0;
    ['bPrev', 'bBack', 'bPlay', 'bFwd', 'bNext'].forEach(function (id) {
      $(id).disabled = !has && !(id === 'bPlay' && tracks.length);
    });
    $('seek').disabled = !has;
    $('nowCover').disabled = !has;
  }

  function updateNow() {
    var cv = $('nowCover');
    if (current < 0 || !tracks[current]) {
      cv.style.background = ''; cv.style.backgroundImage = ''; cv.style.color = '';
      cv.innerHTML = '<svg class="i"><use href="#i-note"/></svg>';
      $('nowTitle').textContent = 'Nada sonando';
      $('nowSub').textContent = tracks.length ? 'Toca una canción de la lista' : 'Sube un MP3 para empezar';
      $('tCur').textContent = '0:00'; $('tDur').textContent = '0:00';
      $('seek').value = 0; $('seek').style.setProperty('--p', '0%');
      return;
    }
    var t = tracks[current];
    paintCover(cv, t);
    $('nowTitle').textContent = t.name;
    $('nowSub').textContent = 'Canción ' + (current + 1) + ' de ' + tracks.length + (t.cover ? '' : ' · toca la imagen para ponerle portada');
  }

  /* ---------- Reproducción ---------- */
  // Reconstruye el audio desde el archivo guardado. Sirve cuando el sistema
  // deja la reproducción trabada (por ejemplo tras pausar en segundo plano y mover el tiempo).
  function rebuild(resumeAt, thenPlay) {
    if (current < 0 || !tracks[current]) return;
    recovering = true;
    var onMeta = function () {
      audio.removeEventListener('loadedmetadata', onMeta);
      try { if (resumeAt > 0) audio.currentTime = resumeAt; } catch (e) {}
      recovering = false;
      if (thenPlay) { try { audio.play().catch(function () {}); } catch (e) {} }
    };
    audio.addEventListener('loadedmetadata', onMeta);
    audio.src = tracks[current].url;
    audio.load();
  }

  function play() {
    if (current < 0) return;
    wantPlaying = true;
    var id = tracks[current].id;
    var at = audio.currentTime;
    var p = null;
    try { p = audio.play(); } catch (e) {}
    if (p && p.catch) {
      p.catch(function (err) {
        var n = err && err.name;
        if (n === 'AbortError' || n === 'NotAllowedError') return;
        if (wantPlaying && tracks[current] && tracks[current].id === id) rebuild(at, true);
      });
    }
    clearTimeout(watchdog);
    watchdog = setTimeout(function () {
      if (!wantPlaying || recovering || audio.ended) return;
      if (current < 0 || !tracks[current] || tracks[current].id !== id) return;
      // Dice que suena pero el tiempo no avanza, o se quedó en pausa: reconstruir.
      if (audio.paused || audio.currentTime === at) rebuild(at, true);
    }, 1600);
  }
  function pauseAudio() {
    wantPlaying = false;
    clearTimeout(watchdog);
    audio.pause();
  }
  function toggle() {
    if (current < 0 && tracks.length) { select(0, true); return; }
    if (current < 0) return;
    if (audio.paused) play(); else pauseAudio();
  }

  function select(i, autoplay) {
    if (i < 0 || i >= tracks.length) return;
    current = i;
    errRetry = false;
    wantPlaying = !!autoplay;
    clearTimeout(watchdog);
    audio.src = tracks[i].url;
    updateNow(); renderList(); updateControls(); setMediaSession();
    if (autoplay) play();
  }
  function next() { if (tracks.length) select((current + 1) % tracks.length, true); }
  function prev() {
    if (!tracks.length) return;
    // Como en Spotify: pasados 3 s reinicia la canción; antes de eso va a la anterior.
    if (audio.currentTime > 3) { seekTo(0); return; }
    select((current - 1 + tracks.length) % tracks.length, true);
  }
  function seekTo(t) {
    if (current < 0) return;
    if (isFinite(audio.duration)) t = Math.min(audio.duration, t);
    audio.currentTime = Math.max(0, t);
  }
  function skip(sec) { seekTo(audio.currentTime + sec); }

  function removeTrack(i) {
    var t = tracks[i];
    if (!t) return;
    dbDel(t.id);
    try { URL.revokeObjectURL(t.url); } catch (e) {}
    var wasCurrent = i === current;
    tracks.splice(i, 1);
    if (wasCurrent) {
      pauseAudio(); audio.removeAttribute('src'); audio.load();
      current = -1;
      if (tracks.length) { select(Math.min(i, tracks.length - 1), false); return; }
    } else if (i < current) { current--; }
    updateNow(); renderList(); updateControls(); setMediaSession();
  }

  /* ---------- Agregar archivos ---------- */
  function addFiles(files) {
    var added = 0;
    Array.prototype.forEach.call(files, function (f) {
      var ok = (f.type && f.type.indexOf('audio') === 0) || /\.mp3$/i.test(f.name);
      if (!ok) return;
      var t = {
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        name: cleanName(f.name), blob: f, added: Date.now() + added, cover: '',
        url: URL.createObjectURL(f), duration: 0
      };
      dbSave(t);
      tracks.push(t); added++;
      probeDuration(t);
    });
    if (!added) { flashHint('Solo se pueden subir archivos de audio (MP3).'); return; }
    if (current < 0) select(0, false); else { updateNow(); renderList(); updateControls(); }
    flashHint(added === 1 ? 'Canción agregada.' : added + ' canciones agregadas.');
  }
  function probeDuration(t) {
    var a = new Audio(); a.preload = 'metadata';
    a.addEventListener('loadedmetadata', function () { t.duration = a.duration; renderList(); });
    a.src = t.url;
  }
  var hintTimer;
  function flashHint(msg) {
    $('hint').textContent = msg;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { $('hint').textContent = ''; }, 3500);
  }

  /* ---------- Portadas ---------- */
  function pickCover(id) {
    coverTarget = id;
    $('coverFile').click();
  }
  function setCover(id, file) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
      var c = document.createElement('canvas');
      c.width = c.height = 512;
      c.getContext('2d').drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 512, 512);
      var data = c.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url);
      var t = byId(id);
      if (!t) return;
      t.cover = data;
      dbSave(t);
      if (current >= 0 && tracks[current] === t) { updateNow(); setMediaSession(); }
      renderList();
      flashHint('Portada guardada.');
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      flashHint('No se pudo leer esa imagen. Prueba con un JPG o PNG.');
    };
    img.src = url;
  }

  /* ---------- Segundo plano y pantalla bloqueada ---------- */
  function setMediaSession() {
    if (!('mediaSession' in navigator)) return;
    try {
      var t = tracks[current];
      if (!t) { navigator.mediaSession.metadata = null; return; }
      var src = t.cover || (t.art = t.art || makeArt(t.name));
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.name, artist: 'Musiquita Dumps', album: 'Mis MP3',
        artwork: [{ src: src, sizes: '512x512', type: 'image/jpeg' }]
      });
    } catch (e) {}
  }
  function initMediaSession() {
    if (!('mediaSession' in navigator)) return;
    var set = function (a, fn) { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) {} };
    set('play', function () { play(); });
    set('pause', function () { pauseAudio(); });
    set('previoustrack', prev);
    set('nexttrack', next);
    set('seekto', function (d) { if (d && typeof d.seekTime === 'number') seekTo(d.seekTime); });
    // Sin seekbackward/seekforward: en iPhone reemplazan a los botones anterior/siguiente.
    set('seekbackward', null);
    set('seekforward', null);
  }
  function updatePosition() {
    if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration, playbackRate: audio.playbackRate || 1,
        position: Math.min(Math.max(audio.currentTime, 0), audio.duration)
      });
    } catch (e) {}
  }

  /* ---------- Eventos ---------- */
  var seekEl = $('seek');
  function paintSeek(v) { seekEl.style.setProperty('--p', (v / 10) + '%'); }
  audio.addEventListener('timeupdate', function () {
    if (seeking) return;
    var d = audio.duration;
    var v = isFinite(d) && d > 0 ? (audio.currentTime / d) * 1000 : 0;
    seekEl.value = v; paintSeek(v);
    $('tCur').textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', function () {
    $('tDur').textContent = fmt(audio.duration);
    if (tracks[current] && !tracks[current].duration) { tracks[current].duration = audio.duration; renderList(); }
    updatePosition();
  });
  audio.addEventListener('play', function () {
    setIcon('#i-pause'); $('bPlay').setAttribute('aria-label', 'Pausar');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  });
  audio.addEventListener('pause', function () {
    setIcon('#i-play'); $('bPlay').setAttribute('aria-label', 'Reproducir');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    updatePosition();
  });
  audio.addEventListener('seeked', function () {
    updatePosition();
    // Si mover el tiempo dejó el audio detenido sin que la persona pausara, seguir.
    if (wantPlaying && audio.paused && !recovering) play();
  });
  audio.addEventListener('ended', next);
  audio.addEventListener('error', function () {
    if (current < 0 || !tracks[current] || recovering) return;
    if (!errRetry) { errRetry = true; rebuild(audio.currentTime || 0, wantPlaying); }
    else flashHint('No se pudo reproducir esta canción.');
  });

  seekEl.addEventListener('input', function () {
    seeking = true;
    paintSeek(seekEl.value);
    if (isFinite(audio.duration)) $('tCur').textContent = fmt((seekEl.value / 1000) * audio.duration);
  });
  seekEl.addEventListener('change', function () {
    if (isFinite(audio.duration)) seekTo((seekEl.value / 1000) * audio.duration);
    seeking = false;
  });

  $('bPlay').addEventListener('click', toggle);
  $('bPrev').addEventListener('click', prev);
  $('bNext').addEventListener('click', next);
  $('bBack').addEventListener('click', function () { skip(-10); });
  $('bFwd').addEventListener('click', function () { skip(10); });
  $('addBtn').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function (e) { addFiles(e.target.files); e.target.value = ''; });
  $('nowCover').addEventListener('click', function () { if (current >= 0 && tracks[current]) pickCover(tracks[current].id); });
  $('coverFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f || coverTarget === null) return;
    var ok = (f.type && f.type.indexOf('image') === 0) || /\.(png|jpe?g|webp|gif|heic|heif)$/i.test(f.name);
    if (!ok) { flashHint('Elige una imagen (JPG o PNG).'); return; }
    setCover(coverTarget, f);
  });

  var listEl = $('list');
  ['dragenter', 'dragover'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); listEl.classList.add('dragging'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); listEl.classList.remove('dragging'); });
  });
  document.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'BUTTON') return;
    if (e.key === 'ArrowRight') skip(10);
    else if (e.key === 'ArrowLeft') skip(-10);
    else if (e.key === ' ') { e.preventDefault(); toggle(); }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}

  /* ---------- Inicio ---------- */
  initMediaSession();
  renderList(); updateNow(); updateControls();
  openDB().then(function (d) {
    db = d;
    return dbAll();
  }).then(function (rows) {
    rows.sort(function (a, b) { return a.added - b.added; });
    rows.forEach(function (r) {
      var t = { id: r.id, name: r.name, blob: r.blob, added: r.added, cover: r.cover || '', url: URL.createObjectURL(r.blob), duration: 0 };
      tracks.push(t); probeDuration(t);
    });
    if (tracks.length) select(0, false); else { renderList(); updateControls(); }
  });
})();
</script>
</body>
</html>
